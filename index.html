<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Карта повітряних тривог України</title>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sky-monitor.fun/">
    <meta property="og:title" content="Карта повітряних тривог України">
    <meta property="og:description" content="Карта повітряних тривог України. Моніторинг повітряних тривог та авіації.">
    <meta property="og:image" content="https://sky-monitor.fun/logo.jpg">

    <link rel="canonical" href="https://sky-monitor.fun">
    <link rel="icon" href="https://sky-monitor.fun/favicon.ico" type="image/x-icon">

    <style>
        :root { --accent: #00f2ff; --bg: #0d1117; --card: rgba(22, 27, 34, 0.85); }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Inter', sans-serif; color: #fff; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; height: 100vh; position: relative; }

        /* ВЕРХНЯ ПАНЕЛЬ */
        .header-panel { display: flex; align-items: center; padding: 10px 20px; background: #161b22; border-bottom: 2px solid var(--accent); }
        .monitor-brand { color: var(--accent); font-weight: bold; font-size: 14px; margin-right: 20px; line-height: 1.2; }
        #clock { color: #ff3333; font-size: 20px; font-weight: bold; margin-right: 20px; }
        .flag { width: 40px; height: 25px; background: linear-gradient(180deg, #0057b7 50%, #ffd700 50%); border-radius: 3px; animation: wave 3s infinite ease-in-out; margin-right: 15px; }
        @keyframes wave { 0%, 100% { transform: skewY(-2deg); } 50% { transform: skewY(2deg); } }

        .viewport { flex-grow: 1; margin: 8px; border-radius: 15px; overflow: hidden; background: #000; border: 1px solid var(--accent); position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        /* ЛЕГЕНДА */
        @keyframes blink { 
            0% { opacity: 1; } 
            50% { opacity: 0.5; } 
            100% { opacity: 1; } 
        }

        .legend-block { 
            animation: blink 2s infinite; 
            position: absolute !important; 
            bottom: 150px !important; 
            left: 20px !important; 
            top: auto !important;
            background: rgba(0, 0, 0, 0.85); 
            padding: 15px; 
            border-radius: 15px; 
            border: 2px solid #ff0000; 
            animation: border-pulse 2s infinite; 
            z-index: 9999 !important; 
            font-size: 14px; 
            pointer-events: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Анімація обертання градієнта */
        @keyframes border-rotate-red {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Клас для бігучої червоної лінії */
        .red-glowing-border {
            position: relative;
            border: 2px solid transparent !important;
            background-image: 
                linear-gradient(#161b22, #161b22), 
                linear-gradient(90deg, transparent, #ff0000, transparent, #ff0000, transparent);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            animation: border-rotate-red 3s linear infinite;
        }

        /* Заголовок жовтий */
        .legend-title {
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
            color: #ffde00;
            text-shadow: 0 0 5px #000;
        }

        /* Червона обводка з мерехтінням */
        @keyframes border-pulse {
            0% { border-color: #ff0000; box-shadow: 0 0 10px #ff0000; }
            50% { border-color: #770000; box-shadow: 0 0 20px #ff0000; }
            100% { border-color: #ff0000; box-shadow: 0 0 10px #ff0000; }
        }

        /* Індикатор мигання */
        .status-indicator-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: bold;
            color: #ffde00;
            margin-right: 20px;
        }
        .red-dot {
            width: 10px;
            height: 10px;
            background-color: #ff0000;
            border-radius: 50%;
            animation: blink-red 1s infinite;
            box-shadow: 0 0 8px #ff0000;
        }
        @keyframes blink-red {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        .legend-icon { 
            width: 20px; height: 20px; margin-right: 10px; 
            animation: pulse-red 1.5s infinite; 
        }

        @keyframes pulse-red {
            0% { fill: #ff0000; filter: drop-shadow(0 0 5px #ff0000); }
            50% { fill: #ff5555; filter: drop-shadow(0 0 10px #ff0000); }
            100% { fill: #ff0000; filter: drop-shadow(0 0 5px #ff0000); }
        }

        .channel-btn { 
            background: #ff3333; 
            color: white; 
            padding: 5px 15px; 
            border-radius: 5px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 14px; 
            border: 1px solid #fff;
            transition: 0.3s;
            margin-left: 10px; 
            cursor: pointer;
        }

        .channel-btn:hover { opacity: 0.8; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; color: #fff; }

        @media (max-width: 600px) { 
            .legend-block { bottom: 120px !important; left: 10px !important; top: auto !important; padding: 6px; font-size: 10px; } 
            .legend-icon { width: 12px; height: 12px; margin-right: 5px; } 
        }

        .marquee-container { background: #000; color: var(--accent); padding: 5px 0; font-size: 10px; font-weight: 800; border-bottom: 1px solid #30363d; overflow: hidden; white-space: nowrap; }
        .marquee-text { display: inline-block; animation: marquee 30s linear infinite; }
        @keyframes marquee { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    </style>
</head>
