<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Карта повітряних тривог України</title>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sky-monitor.fun/">
    <meta property="og:title" content="Карта повітряних тривог України">
    <meta property="og:description" content="Карта повітряних тривог України. Моніторинг повітряних тривог та авіації.">
    <meta property="og:image" content="https://sky-monitor.fun/logo.jpg">

    <link rel="canonical" href="https://sky-monitor.fun">
    <link rel="icon" href="https://sky-monitor.fun/favicon.ico" type="image/x-icon">

    <style>
        :root { 
            --bg: #0a0d12; 
            --panel: #11151c; 
            --accent-yellow: #ffde00;
            --border: #1e2633;
        }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Inter', sans-serif; color: #fff; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; height: 100vh; position: relative; }

        /* ВЕРХНЯ ПАНЕЛЬ */
        .header-panel { 
            display: flex; align-items: center; padding: 12px 30px; 
            background: #0d1117; border-bottom: 2px solid #1e2633;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }

        /* MONITOR v1.0 */
        .brand-container { display: flex; align-items: baseline; gap: 10px; margin-right: 20px; }
        .monitor-brand { 
            font-size: 24px; font-weight: 900; color: #ff3333;
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        .version-tag { font-size: 10px; color: #555; font-weight: bold; }

        /* ЖОВТА КНОПКА КАНАЛ */
        .channel-btn { 
            background: transparent; 
            color: var(--accent-yellow); 
            padding: 5px 15px; 
            border: 1px solid var(--accent-yellow);
            border-radius: 4px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 11px; 
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 8px rgba(255, 222, 0, 0.3);
        }
        .channel-btn:hover { background: var(--accent-yellow); color: #000; box-shadow: 0 0 15px rgba(255, 222, 0, 0.6); }

        /* ВАШ СТАРИЙ ІНДИКАТОР */
        .status-container { 
            display: flex; align-items: center; background: #000; 
            padding: 4px 12px; border-radius: 20px; 
            border: 1px solid #333; margin-left: auto; 
        }
        .red-dot { 
            width: 8px; height: 8px; background-color: #ff0000; 
            border-radius: 50%; animation: blink-red 1s infinite; 
            box-shadow: 0 0 5px #ff0000; margin-right: 6px; 
        }
        @keyframes blink-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        /* КАРТА */
        .viewport { flex-grow: 1; margin: 10px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        /* БІГУЧИЙ РЯДОК */
        .marquee-container { background: #000; color: var(--accent-yellow); padding: 8px 0; font-size: 12px; font-weight: 800; border-top: 1px solid var(--border); overflow: hidden; white-space: nowrap; }
        .marquee-text { display: inline-block; animation: marquee 30s linear infinite; }
        @keyframes marquee { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header-panel">
            <div class="brand-container">
                <div class="monitor-brand">MONITOR</div>
                <div class="version-tag">v1.0</div>
            </div>
            
            <a href="https://t.me/manitoringkiev" class="channel-btn" target="_blank">КАНАЛ</a>
            
            <div class="status-container">
                <div class="red-dot"></div>
                <span style="font-size: 11px; color: white; font-weight: bold;">АКТИВНО</span>
            </div>
        </div>

        <main class="viewport">
            <iframe src="https://alerts.in.ua/?theme=dark"></iframe>
        </main>

        <div class="marquee-container">
            <div id="rss-feed" class="marquee-text">Завантаження...</div>
        </div>
    </div>

<script src="https://app.allwidgets.ru/s/cookies/f8d3d8b1-b2db-4ff5-bf12-f033b3c9bfd7/"></script>
<script src="https://app.allwidgets.ru/s/messengers/5e25176f-dbc9-47e7-b836-a0630dd4608b/"></script>   
    
    <script>
        async function loadApi() {
            try {
                const response = await fetch("https://api.ukrainealarm.com/api/v3/alerts", {
                    headers: { "Authorization": "Bearer eb5f64ff:206e35375c2c8dc5ef154faefa9f39f9", "Accept": "application/json" }
                });
                const data = await response.json();
                document.getElementById('rss-feed').innerText = data.length > 0 ? "🚨 ТРИВОГИ: " + data.map(a => a.regionName).join(" | ") : "✅ СТАТУС: ТРИВОГ НЕМАЄ | СЛАВА УКРАЇНІ!";
            } catch(e) { document.getElementById('rss-feed').innerText = "Система активна..."; }
        }
        loadApi(); setInterval(loadApi, 3000);
    </script>
</body>
</html>
