<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Карта повітряних тривог України</title>
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sky-monitor.fun/">
    <meta property="og:title" content="Карта повітряних тривог України">
    <meta property="og:description" content="Карта повітряних тривог України. Моніторинг повітряних тривог та авіації.">
    <meta property="og:image" content="https://sky-monitor.fun/logo.jpg">
    
    <link rel="canonical" href="https://sky-monitor.fun">
    <link rel="icon" href="https://sky-monitor.fun/favicon.ico" type="image/x-icon">
    
    <style>
        :root { 
            --accent: #ffcc00; /* Золотий акцент як на BlackCellUA */
            --bg: #0d1117; 
            --card-bg: #161b22; 
            --border: #30363d;
        }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Inter', sans-serif; color: #fff; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; height: 100vh; position: relative; }

        /* ВЕРХНЯ ПАНЕЛЬ */
        .header-panel { 
            display: flex; align-items: center; padding: 10px 20px; 
            background: var(--card-bg); 
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
        }
        .monitor-brand { color: var(--accent); font-weight: 800; font-size: 16px; margin-right: 20px; letter-spacing: 1px; }
        #clock { color: #fff; font-size: 18px; font-weight: bold; margin-right: auto; }

        .viewport { flex-grow: 1; margin: 10px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        /* КНОПКИ У СТИЛІ САЙТУ */
        .btn-blackcell {
            background: #161b22;
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            border: 1px solid var(--accent);
            margin-left: 10px;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn-blackcell:hover { background: var(--accent); color: #000; }

        /* ЛЕГЕНДА */
        .legend-block { 
            position: absolute !important; bottom: 150px !important; left: 20px !important; 
            background: var(--card-bg); padding: 15px; border-radius: 8px; 
            border: 1px solid var(--accent); z-index: 9999 !important; font-size: 13px; 
            pointer-events: none; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .legend-title { color: var(--accent); font-weight: bold; margin-bottom: 10px; text-align: center; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; }
        .legend-icon { width: 18px; height: 18px; margin-right: 10px; fill: var(--accent); }

        /* БЕГУЩАЯ СТРОКА */
        .marquee-container { background: var(--card-bg); color: var(--accent); padding: 8px 0; font-size: 12px; font-weight: bold; border-top: 1px solid var(--border); overflow: hidden; white-space: nowrap; }
        .marquee-text { display: inline-block; animation: marquee 30s linear infinite; }
        @keyframes marquee { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header-panel">
        <div class="monitor-brand">BLACKCELLUA | MONITOR</div>
        <div id="clock">00:00:00</div>
        
        <a href="https://t.me/manitoringkiev" class="btn-blackcell" target="_blank">Telegram</a>
        <a href="https://frames2.payhub.com.ua/moneybox?box_id=589cbce5-320d-4d3c-9abc-c4d388138564" class="btn-blackcell" target="_blank">Донат</a>
    </div>   

    <main class="viewport">
        <div class="legend-block">
            <div class="legend-title">ТИПИ ЗАГРОЗ</div>
            <div class="legend-item"><svg class="legend-icon" viewBox="0 0 100 100"><path d="M50 5 L60 20 L60 60 L80 60 L80 70 L60 70 L60 90 L40 90 L40 70 L20 70 L20 60 L40 60 L40 20 Z"/></svg><div>Крилаті ракети</div></div>
            <div class="legend-item"><svg class="legend-icon" viewBox="0 0 100 100"><path d="M50 20 L80 70 L70 80 L50 70 L30 80 L20 70 Z"/></svg><div>Ударні БпЛА</div></div>
        </div>

        <iframe src="https://alerts.in.ua/?theme=dark"></iframe>
    </main>

    <div class="marquee-container">
        <div id="rss-feed" class="marquee-text">Ініціалізація системи...</div>
    </div>
</div>

<script>
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('uk-UA');
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function loadApi() {
        try {
            const response = await fetch("https://api.ukrainealarm.com/api/v3/alerts", {
                headers: { "Authorization": "Bearer eb5f64ff:206e35375c2c8dc5ef154faefa9f39f9", "Accept": "application/json" }
            });
            const data = await response.json();
            document.getElementById('rss-feed').innerText = data.length > 0 ? "🚨 ТРИВОГИ: " + data.map(a => a.regionName).join(" | ") : "✅ СТАТУС: ТРИВОГ НЕМАЄ | СЛАВА УКРАЇНІ!";
        } catch(e) { document.getElementById('rss-feed').innerText = "Система активна..."; }
    }
    loadApi(); setInterval(loadApi, 15000);
</script>

</body>
</html>
