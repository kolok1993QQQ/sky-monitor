<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Карта повітряних тривог України</title>
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sky-monitor.fun/">
    <meta property="og:title" content="Карта повітряних тривог України">
    <meta property="og:description" content="Карта повітряних тривог України. Моніторинг повітряних тривог та авіації.">
    <meta property="og:image" content="https://sky-monitor.fun/logo.jpg">
    
    <link rel="canonical" href="https://sky-monitor.fun">
    <link rel="icon" href="https://sky-monitor.fun/favicon.ico" type="image/x-icon">
    
    <style>
        :root { --accent: #ffcc00; --bg: #0d1117; --card: #161b22; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Inter', sans-serif; color: #fff; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; height: 100vh; position: relative; }

        /* ВЕРХНЯ ПАНЕЛЬ */
        .header-panel { display: flex; align-items: center; padding: 10px 20px; background: #000; border-bottom: 2px solid var(--accent); }
        .monitor-brand { color: var(--accent); font-weight: bold; font-size: 16px; margin-right: 20px; }
        #clock { color: #fff; font-size: 16px; font-weight: bold; margin-left: auto; margin-right: 20px; }
        
        .channel-btn { 
            background: #000; color: #fff; padding: 5px 15px; border-radius: 4px; 
            text-decoration: none; font-weight: bold; font-size: 12px; border: 1px solid var(--accent);
            margin-left: 10px; cursor: pointer; text-transform: uppercase;
        }
        .channel-btn:hover { background: var(--accent); color: #000; }

        .viewport { flex-grow: 1; margin: 0; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        /* ЛЕГЕНДА З БІГУЧОЮ РАМКОЮ */
        .legend-block { 
            position: absolute !important; bottom: 80px !important; left: 20px !important; 
            padding: 15px; border-radius: 8px; z-index: 9999 !important; pointer-events: none;
            background: #0d1117;
            border: 2px solid transparent;
            background-image: linear-gradient(#0d1117, #0d1117), linear-gradient(90deg, #ffcc00, #00f2ff, #ffcc00);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            animation: border-rotate 3s linear infinite;
        }
        @keyframes border-rotate {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .legend-title { text-align: center; margin-bottom: 10px; font-weight: bold; color: var(--accent); text-transform: uppercase; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 13px; }
        .legend-icon { width: 18px; height: 18px; margin-right: 10px; fill: var(--accent); }
        
        .marquee-container { background: #000; color: var(--accent); padding: 8px 0; font-size: 12px; font-weight: bold; border-top: 1px solid var(--accent); overflow: hidden; white-space: nowrap; }
        .marquee-text { display: inline-block; animation: marquee 30s linear infinite; }
        @keyframes marquee { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header-panel">
        <div class="monitor-brand">BLACKCELLUA | MONITOR</div>
        <div id="clock">00:00:00</div>
        <a href="https://t.me/manitoringkiev" class="channel-btn" target="_blank">TELEGRAM</a>
        <a href="https://frames2.payhub.com.ua/moneybox?box_id=589cbce5-320d-4d3c-9abc-c4d388138564" class="channel-btn" target="_blank">ДОНАТ</a>
    </div>   

    <main class="viewport">
        <div class="legend-block">
            <div class="legend-title">ТИПИ ЗАГРОЗ</div>
            <div class="legend-item"><svg class="legend-icon" viewBox="0 0 100 100"><path d="M50 5 L60 20 L60 60 L80 60 L80 70 L60 70 L60 90 L40 90 L40 70 L20 70 L20 60 L40 60 L40 20 Z"/></svg><div>Крилаті ракети</div></div>
            <div class="legend-item"><svg class="legend-icon" viewBox="0 0 100 100"><path d="M50 20 L80 70 L70 80 L50 70 L30 80 L20 70 Z"/></svg><div>Ударні БпЛА</div></div>
        </div>

        <iframe src="https://alerts.in.ua/?theme=dark"></iframe>
    </main>

    <div class="marquee-container">
        <div id="rss-feed" class="marquee-text">Ініціалізація системи...</div>
    </div>
</div>

<script>
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('uk-UA');
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function loadApi() {
        try {
            const response = await fetch("https://api.ukrainealarm.com/api/v3/alerts", {
                headers: { "Authorization": "Bearer eb5f64ff:206e35375c2c8dc5ef154faefa9f39f9", "Accept": "application/json" }
            });
            const data = await response.json();
            document.getElementById('rss-feed').innerText = data.length > 0 ? "🚨 ТРИВОГИ: " + data.map(a => a.regionName).join(" | ") : "✅ СТАТУС: ТРИВОГ НЕМАЄ | СЛАВА УКРАЇНІ!";
        } catch(e) { document.getElementById('rss-feed').innerText = "Система активна..."; }
    }
    loadApi(); setInterval(loadApi, 15000);
</script>

</body>
</html>
