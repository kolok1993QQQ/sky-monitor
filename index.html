<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Карта повітряних тривог України</title>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sky-monitor.fun/">
    <meta property="og:title" content="Карта повітряних тривог України">
    <meta property="og:description" content="Карта повітряних тривог України. Моніторинг повітряних тривог та авіації.">
    <meta property="og:image" content="https://sky-monitor.fun/logo.jpg">

    <link rel="canonical" href="https://sky-monitor.fun">
    <link rel="icon" href="https://sky-monitor.fun/favicon.ico" type="image/x-icon">

    <style>
        :root { 
            --bg: #0a0d12; 
            --panel: #0d1117; 
            --accent-red: #ff3333;
            --border: #1e2633;
        }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Inter', sans-serif; color: #fff; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; height: 100vh; position: relative; }

        /* ВЕРХНЯ ПАНЕЛЬ */
        .header-panel { 
            display: flex; align-items: center; padding: 15px 30px; 
            background: var(--panel); border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }

        /* BRAND v1.0 */
        .brand-container { display: flex; align-items: baseline; gap: 10px; margin-right: 30px; }
        .monitor-brand { 
            font-size: 26px; font-weight: 900; color: var(--accent-red);
            text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }
        .version-tag { font-size: 10px; color: #4a5568; font-weight: bold; }

        /* КНОПКА КАНАЛ */
        .channel-btn { 
            background: transparent; color: var(--accent-red);
            padding: 6px 18px; border: 1px solid var(--accent-red);
            border-radius: 4px; text-decoration: none; 
            font-weight: bold; font-size: 12px; text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .channel-btn:hover { background: var(--accent-red); color: #fff; }

        /* ІНДИКАТОР */
        .status-container { 
            display: flex; align-items: center; background: #000; 
            padding: 6px 15px; border-radius: 20px; 
            border: 1px solid #333; margin-left: auto; 
        }
        .red-dot { 
            width: 8px; height: 8px; background-color: #ff0000; 
            border-radius: 50%; animation: blink 1.5s infinite; 
            box-shadow: 0 0 8px #ff0000; margin-right: 8px; 
        }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* КАРТА */
        .viewport { flex-grow: 1; margin: 10px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        /* БІГУЧИЙ РЯДОК */
        .marquee-container { background: #000; color: #ffde00; padding: 8px 0; font-size: 12px; font-weight: 800; border-top: 1px solid var(--border); overflow: hidden; white-space: nowrap; }
        .marquee-text { display: inline-block; animation: marquee 30s linear infinite; }
        @keyframes marquee { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header-panel">
            <div class="brand-container">
                <div class="monitor-brand">MONITOR</div>
                <div class="version-tag">v1.0</div>
            </div>
            
            <a href="https://t.me/manitoringkiev" class="channel-btn" target="_blank">КАНАЛ</a>
            
            <div class="status-container">
                <div class="red-dot"></div>
                <span style="font-size: 11px; font-weight: bold; color: #fff;">АКТИВНО</span>
            </div>
        </div>

        <main class="viewport">
            <iframe src="https://alerts.in.ua/?theme=dark"></iframe>
        </main>

        <div class="marquee-container">
            <div id="rss-feed" class="marquee-text">Завантаження...</div>
        </div>
    </div>

    <script>
        async function loadApi() {
            try {
                const response = await fetch("https://api.ukrainealarm.com/api/v3/alerts", {
                    headers: { "Authorization": "Bearer eb5f64ff:206e35375c2c8dc5ef154faefa9f39f9", "Accept": "application/json" }
                });
                const data = await response.json();
                document.getElementById('rss-feed').innerText = data.length > 0 ? "🚨 ТРИВОГИ: " + data.map(a => a.regionName).join(" | ") : "✅ СТАТУС: ТРИВОГ НЕМАЄ | СЛАВА УКРАЇНІ!";
            } catch(e) { document.getElementById('rss-feed').innerText = "Система активна..."; }
        }
        loadApi(); setInterval(loadApi, 3000);
    </script>
</body>
</html>
