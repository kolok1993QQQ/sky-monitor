<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Карта повітряних тривог України</title>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sky-monitor.fun/">
    <meta property="og:title" content="Карта повітряних тривог України">
    <meta property="og:description" content="Карта повітряних тривог України. Моніторинг повітряних тривог та авіації.">
    <meta property="og:image" content="https://sky-monitor.fun/logo.jpg">

    <link rel="canonical" href="https://sky-monitor.fun">
    <link rel="icon" href="https://sky-monitor.fun/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0d12;
            --panel-bg: #11151c;
            --neon-blue: #00f2ff;
            --gold: #ffde00;
        }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg-dark); font-family: 'Rajdhani', sans-serif; color: #fff; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; height: 100vh; }

        /* ПАНЕЛЬ BLACKCELLUA */
        .header-panel {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 30px; background: var(--panel-bg);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        }
        .brand { font-size: 26px; font-weight: 700; color: #fff; letter-spacing: 2px; text-transform: uppercase; }
        .brand span { color: var(--gold); }

        .nav-buttons { display: flex; gap: 10px; }
        .btn-style {
            background: transparent; border: 1px solid var(--neon-blue); color: #fff;
            padding: 6px 16px; border-radius: 4px; font-size: 13px;
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }
        .btn-style:hover { background: rgba(0, 242, 255, 0.1); }
        .btn-gold { border-color: var(--gold); color: var(--gold); }

        /* КАРТА */
        .viewport { flex-grow: 1; margin: 10px; border-radius: 4px; overflow: hidden; border: 1px solid #1e2633; }
        iframe { width: 100%; height: 100%; border: none; }

        /* БІГУЧИЙ РЯДОК */
        .marquee-container { background: #000; color: var(--gold); padding: 8px 0; font-size: 14px; border-top: 1px solid #1e2633; overflow: hidden; white-space: nowrap; }
        .marquee-text { display: inline-block; animation: marquee 30s linear infinite; }
        @keyframes marquee { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header-panel">
            <div class="brand">BLACKCELL<span>UA</span></div>
            <div class="nav-buttons">
                <button class="btn-style btn-gold">🏆 Танкіст UA [LVL 1]</button>
                <button class="btn-style">▶ YouTube</button>
                <button class="btn-style">💳 Донат</button>
            </div>
        </div>

        <main class="viewport">
            <iframe src="https://alerts.in.ua/?theme=dark"></iframe>
        </main>

        <div class="marquee-container">
            <div id="rss-feed" class="marquee-text">Завантаження даних...</div>
        </div>
    </div>

    <script>
        async function loadApi() {
            try {
                const response = await fetch("https://api.ukrainealarm.com/api/v3/alerts", {
                    headers: { "Authorization": "Bearer eb5f64ff:206e35375c2c8dc5ef154faefa9f39f9", "Accept": "application/json" }
                });
                const data = await response.json();
                document.getElementById('rss-feed').innerText = data.length > 0 ? "🚨 ТРИВОГИ: " + data.map(a => a.regionName).join(" | ") : "✅ СТАТУС: ТРИВОГ НЕМАЄ | СЛАВА УКРАЇНІ!";
            } catch(e) { document.getElementById('rss-feed').innerText = "Система активна..."; }
        }
        loadApi(); setInterval(loadApi, 3000);
    </script>
</body>
</html>
